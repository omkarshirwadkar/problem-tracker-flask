{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Forgot Password</h2>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email</label>
    <input type="email" name="email" required>
    <button class="btn" type="submit">Send Reset Link</button>
  </form>
</div>
{% endblock %}
