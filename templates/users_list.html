{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Other Users</h2>
  <p>Click a user to see their solved problems.</p>

  {% if users %}
    <ul>
      {% for user in users %}
        <li>
          <a href="{{ url_for('community.user_profile', user_id=user.id) }}">
            {{ user.username }}
          </a>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No other users found.</p>
  {% endif %}
</div>
{% endblock %}
